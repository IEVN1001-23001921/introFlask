{% extends "layout.html" %}
    {% block container %}
    <h1> Operas Bas</h1>
<form action="/operasBas" method="post">
 
<div class="mb-3">
 
    <label for="n1" class="form-label">Numero 1:</label>
<input type="number" class="form-control" id="n1" name="n1">
</div>
<div class="mb-3">
 
    <label for="n2" class="form-label">Numero 2:</label>
<input type="number" class="form-control" id="n2" name="n2">
</div>
<label class="form-label">Seleccione la operación:</label>
 
            <div class="form-check">
<input class="form-check-input" type="radio" name="operacion" value="sumar" checked>
<label class="form-check-label">Sumar</label>
</div>
 
            <div class="form-check">
<input class="form-check-input" type="radio" name="operacion" value="restar">
<label class="form-check-label">Restar</label>
</div>
 
            <div class="form-check">
<input class="form-check-input" type="radio" name="operacion" value="multiplicar">
<label class="form-check-label">Multiplicar</label>
</div>
 
 
<button type="submit" class="btn btn-primary">Calcular</button>
</form>
 
<h1>
        {% if operacion %}
        El resultado de {{ operacion }} es:
        {{ n1 }} {{ signo }} {{ n2 }} = {{ "%.2f"|format(res) }}
    {% endif %}

</h1>
    {% endblock %}
